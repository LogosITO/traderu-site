name: Refresh MOEX quotes

on:
  schedule:
    - cron: "17 4-20/2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node fetch-quotes.mjs
      - name: Publish updated quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || git commit -m "chore: refresh MOEX quotes"
          git push
